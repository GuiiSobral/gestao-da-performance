<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0C1037">
  <title>Gestão da Performance</title>
  <script>
    (function () {
      var t = null; try { t = localStorage.getItem("tema"); if (!t) { var a = localStorage.getItem("gp.tema"); t = a === "dark" ? "escuro" : a === "light" ? "claro" : null; } } catch (e) {}
      if (t !== "claro" && t !== "escuro") t = matchMedia("(prefers-color-scheme: dark)").matches ? "escuro" : "claro";
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230C1037'/%3E%3Crect x='12' y='7' width='8' height='18' rx='3' fill='%23F7AC70' transform='skewX(-14) translate(4 0)'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
</head>
<body>
  <div id="root"></div>
  <div id="layer"></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden><span id="toastMsg"></span><button type="button" class="toast-act" id="toastAct" hidden>Desfazer</button></div>
  <div id="alert" class="alertbar" role="alert" hidden><span id="alertMsg"></span><button type="button" class="toast-act" id="alertClose">Fechar</button></div>
  <dialog id="confirma" class="confirma" aria-labelledby="confirmaMsg"><p id="confirmaMsg"></p><div class="row-actions"><button type="button" class="btn" id="confirmaNao">Voltar</button><button type="button" class="btn primary" id="confirmaSim">Confirmar</button></div></dialog>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
